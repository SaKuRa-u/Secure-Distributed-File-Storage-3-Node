; Ops PHP (dibaca saat container start, butuh recreate sekali).
; Alasan: default image mematikan log_errors (error_log() hilang entah ke mana)
; dan session.save_path kosong. Keduanya bikin debug SSO mustahil.
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off
log_errors_max_len = 1024
session.save_path = "/tmp"
session.gc_probability = 1
session.gc_divisor = 100
